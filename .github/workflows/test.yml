name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-toolchain:
    name: "Verify Docker PQC Lab & Toolchains"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull or Build Docker Lab Image
        run: |
          docker compose pull lab 2>/dev/null || docker compose build lab

      - name: Run Toolchain & PQC Primitive Verification
        run: |
          docker compose run --rm lab ./docker/verify_toolchain.sh
