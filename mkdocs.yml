site_url: https://auking45.github.io/applied-pqc-lab/
site_name: Applied PQC Lab
site_description: Practical Post-Quantum Cryptography (PQC) & HPKE Engineering Lab
site_author: Applied PQC Lab Contributors
repo_url: https://github.com/auking45/applied-pqc-lab
repo_name: auking45/applied-pqc-lab

theme:
  name: material
  language: ko
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - search.share
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: ko
          name: 한국어
          build: true
          default: true
        - locale: en
          name: English
          build: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tilde

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/mermaid.js

extra_css:
  - stylesheets/extra.css

nav:
  - Overview: index.md
  - 1. Classical Hybrid: 01-classical-hybrid/index.md
  - 2. RFC 9180 HPKE: 02-modern-hpke/index.md
  - 3. NIST PQC Primitives:
      - 3.1 FIPS 203 ML-KEM: 03-pqc-primitives/index.md
      - 3.2 FIPS 204 ML-DSA: 03-pqc-primitives/02-ml-dsa.md
      - 3.3 Security Levels & CNSA 2.0: 03-pqc-primitives/03-security-levels.md
  - 4. PQC X.509 PKI: 04-pki-and-x509/index.md
  - 5. PQC TLS 1.3 / mTLS: 05-tls-and-mtls/index.md
