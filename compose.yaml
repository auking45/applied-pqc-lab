# =============================================================================
# Applied PQC Engineering Lab - Docker Compose Configuration
# =============================================================================

services:
  # Main Development & E2E Testing Environment (OpenSSL 3.5+, Rust, C++20)
  lab:
    build:
      context: .
      dockerfile: docker/Dockerfile.lab
      args:
        BASE_IMAGE: ubuntu:26.04
        OPENSSL_REF: openssl-3.5
    image: applied-pqc-lab:latest
    container_name: pqc-lab
    volumes:
      - .:/workspace
    working_dir: /workspace
    ports:
      - "8443:8443"  # TLS 1.3 / mTLS hands-on testing port
    stdin_open: true
    tty: true
    command: ["/bin/bash"]
